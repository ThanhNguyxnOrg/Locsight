name: CI-Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@ci-v1
    with:
      job_name: Registry & Release Script
      node_version: "22"
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      prepare_command: npm ci
      validation_command: node scripts/validate-languages.cjs && node --check .github/scripts/stage-release-assets.mjs
      typecheck_command: npm exec -- tsc --noEmit
      test_command: node --test .github/scripts/stage-release-assets.test.mjs

  # Keep the legacy job ID for required checks in the org CI policy.
  build-tauri:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
