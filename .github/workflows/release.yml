name: Release

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (recovery only; no new tag is created).
        required: true
        type: string

jobs:
  # ── Resolve the centrally created release tag ──
  create-release:
    # The central controller creates the tag and draft; resolve its version only.
    if: (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          if [ "$EVENT_NAME" = "create" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi

          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Build on 6 targets; Tauri uploads into the central draft release ──
  build-tauri:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            variant: windows-x64
            args: ''
            rust_target: ''
          - platform: windows-latest
            variant: windows-arm64
            args: '--target aarch64-pc-windows-msvc'
            rust_target: 'aarch64-pc-windows-msvc'
          - platform: macos-latest
            variant: macos-arm64
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            variant: macos-x64
            args: '--target x86_64-apple-darwin'
            rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            variant: linux-x64
            args: ''
            rust_target: ''
          - platform: ubuntu-22.04-arm
            variant: linux-arm64
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          persist-credentials: false

      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}


      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install MSVC ARM64 Build Tools (Windows ARM64)
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          echo "VS Installation Path: $vsPath"
          Start-Process -FilePath "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify", "--installPath", """$vsPath""", "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64", "--quiet", "--norestart" -Wait -NoNewWindow

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.agent.outputs.token }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: "🚀 Locsight ${{ needs.create-release.outputs.tag }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Stage exact release assets for central publisher
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: node .github/scripts/stage-release-assets.mjs

      - name: Upload target asset bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-locsight-${{ matrix.variant }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified cross-platform release assets
    needs: [create-release, build-tauri]
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@0cbda3691e1ec9695d3ede536e0b34ff1713f5f0
    with:
      tag: ${{ needs.create-release.outputs.tag }}
      artifact_pattern: release-assets-locsight-*
    secrets: inherit
